name: Android SG APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/corplink-sg-node
      - codex/feilian-android
      - codex/corplink-native-auto-recovery
      - codex/corplink-upstream-1.19.6
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.superpowers/**'

concurrency:
  group: android-sg-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Fail fast on SSID behavior regressions
        timeout-minutes: 4
        run: |
          flutter test \
            test/common/smart_network_policy_test.dart \
            test/common/ordered_config_writer_test.dart \
            test/models/vpn_props_test.dart \
            test/views/smart_network_rule_editor_test.dart

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # The SG fork has been verified locally with Go 1.24.6. Keep the
          # Android cross-build on that toolchain until the native dependency
          # set is independently verified with Go 1.25.
          go-version: '1.24.6'
          cache-dependency-path: core/go.sum

      - name: Cache Android Go build objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: android-go-build-${{ runner.os }}-go1.24.6-${{ hashFiles('core/go.sum') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Read Rust cache version
        id: rust-cache-version
        shell: bash
        run: echo "version=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Configure reproducible test signing
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/sg-test.keystore
          {
            echo "storeFile=sg-test.keystore"
            echo "keyAlias=bettbox-sg-test"
            echo "storePassword=bettbox-sg-test"
            echo "keyPassword=bettbox-sg-test"
          } >> android/local.properties

      - name: Regenerate Dart models and localizations
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run intl_utils:generate
          git diff --exit-code -- lib/l10n lib/models/generated lib/providers/generated

      - name: Upload regenerated Dart sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-dart-sources
          path: lib
          if-no-files-found: error

      - name: Upload resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error

      - name: Run SG Flutter logic tests
        timeout-minutes: 6
        run: |
          flutter test \
            test/android_vpn_ready_action_test.dart \
            test/corplink_authorization_network_gate_test.dart \
            test/corplink_multi_handoff_test.dart \
            test/corplink_multi_status_test.dart \
            test/corplink_node_delay_url_test.dart \
            test/corplink_route_status_test.dart \
            test/corplink_secure_storage_upgrade_test.dart \
            test/corplink_sg_nodes_test.dart \
            test/corplink_sg_overlay_test.dart \
            test/corplink_setup_pipeline_wiring_test.dart \
            test/corplink_sg_settings_test.dart \
            test/corplink_vpn_start_gate_test.dart \
            test/sg_network_handoff_test.dart \
            test/vpn_run_intent_policy_test.dart

      - name: Run SG Flutter UI tests
        timeout-minutes: 6
        run: |
          flutter test --dart-define=SHOW_APP_ENV_BANNER=false \
            test/app_env_banner_test.dart \
            test/corplink_management_panel_test.dart \
            test/sg_dashboard_alignment_test.dart \
            test/sg_dashboard_tile_test.dart

      - name: Run Flutter clash and model tests
        timeout-minutes: 6
        run: flutter test test/clash test/models

      - name: Run Flutter common and provider tests
        timeout-minutes: 10
        run: flutter test test/common test/providers

      - name: Restore Code Forge host cache
        id: code-forge-cache
        uses: actions/cache@v4
        with:
          path: plugins/code_forge/rust/target
          key: code-forge-host-${{ runner.os }}-rust-${{ steps.rust-cache-version.outputs.version }}-${{ hashFiles('plugins/code_forge/rust/Cargo.toml', 'plugins/code_forge/rust/Cargo.lock', 'plugins/code_forge/rust/src/**', 'plugins/code_forge/rust/build.rs', 'plugins/code_forge/rust/rust-toolchain*') }}

      - name: Build Code Forge host test library
        if: steps.code-forge-cache.outputs.cache-hit != 'true'
        working-directory: plugins/code_forge/rust
        run: cargo build --release --locked

      - name: Run Flutter plugin and view tests
        timeout-minutes: 10
        run: flutter test test/plugins test/views

      - name: Run Flutter widget tests
        timeout-minutes: 10
        run: flutter test test/widgets

      - name: Run native recovery policy tests
        run: |
          mkdir -p build/native-recovery-tests
          javac -d build/native-recovery-tests \
            android/app/src/main/java/com/appshub/bettbox/plugins/NativeRecoveryPolicy.java \
            android/app/src/test/java/com/appshub/bettbox/plugins/NativeRecoveryPolicyTest.java
          java -cp build/native-recovery-tests com.appshub.bettbox.plugins.NativeRecoveryPolicyTest

      - name: Run underlying network path policy tests
        run: |
          mkdir -p build/network-path-tests
          javac -d build/network-path-tests \
            android/app/src/main/java/com/appshub/bettbox/plugins/UnderlyingNetworkPathPolicy.java \
            android/app/src/test/java/com/appshub/bettbox/plugins/UnderlyingNetworkPathPolicyTest.java
          java -cp build/network-path-tests com.appshub.bettbox.plugins.UnderlyingNetworkPathPolicyTest

      - name: Run Android smart-stop regression test
        run: |
          mkdir -p build/smart-stop-tests
          javac -d build/smart-stop-tests \
            android/app/src/test/java/com/appshub/bettbox/plugins/SmartStopSourceRegressionTest.java \
            android/app/src/test/java/com/appshub/bettbox/plugins/VpnRunIntentSourceRegressionTest.java
          java -cp build/smart-stop-tests com.appshub.bettbox.plugins.SmartStopSourceRegressionTest
          java -cp build/smart-stop-tests com.appshub.bettbox.plugins.VpnRunIntentSourceRegressionTest

      - name: Run SSID network and Wi-Fi permission policy tests
        run: |
          mkdir -p build/smart-network-tests
          javac -d build/smart-network-tests \
            android/app/src/main/java/com/appshub/bettbox/plugins/SmartNetworkPolicy.java \
            android/app/src/main/java/com/appshub/bettbox/plugins/SmartWifiPermissionRequest.java \
            android/app/src/test/java/com/appshub/bettbox/plugins/SmartNetworkPolicyTest.java \
            android/app/src/test/java/com/appshub/bettbox/plugins/SmartWifiPermissionRequestTest.java
          java -cp build/smart-network-tests com.appshub.bettbox.plugins.SmartNetworkPolicyTest
          java -cp build/smart-network-tests com.appshub.bettbox.plugins.SmartWifiPermissionRequestTest

      - name: Run app-clone access policy tests
        run: |
          mkdir -p build/clone-access-tests
          javac -cp "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" \
            -d build/clone-access-tests \
            android/app/src/main/java/com/appshub/bettbox/services/CloneProfileAccessPolicy.java \
            android/app/src/main/java/com/appshub/bettbox/services/CloneProfilePackageDetector.java \
            android/app/src/test/java/com/appshub/bettbox/services/CloneProfileAccessPolicyTest.java
          java -cp build/clone-access-tests com.appshub.bettbox.services.CloneProfileAccessPolicyTest

      - name: Run LAN route exclusion policy tests
        run: |
          mkdir -p build/lan-route-tests
          javac -d build/lan-route-tests \
            android/app/src/main/java/com/appshub/bettbox/services/LanRouteExclusionPolicy.java \
            android/app/src/test/java/com/appshub/bettbox/services/LanRouteExclusionPolicyTest.java
          java -cp build/lan-route-tests com.appshub.bettbox.services.LanRouteExclusionPolicyTest

      - name: Run compatibility app policy tests
        run: |
          mkdir -p build/compatibility-app-tests
          javac -d build/compatibility-app-tests \
            android/app/src/main/java/com/appshub/bettbox/services/CompatibilityAppPolicy.java \
            android/app/src/main/java/com/appshub/bettbox/services/CompatibilityShortcutPolicy.java \
            android/app/src/test/java/com/appshub/bettbox/services/CompatibilityAppPolicyTest.java \
            android/app/src/test/java/com/appshub/bettbox/services/CompatibilityShortcutPolicyTest.java
          java -cp build/compatibility-app-tests com.appshub.bettbox.services.CompatibilityAppPolicyTest
          java -cp build/compatibility-app-tests com.appshub.bettbox.services.CompatibilityShortcutPolicyTest

      - name: Run Go outbound tests
        working-directory: core/Clash.Meta
        run: go test -p 1 ./adapter/outbound/... ./config ./dns ./hub/executor

      - name: Run Go application core tests
        working-directory: core
        run: go test -p 1 ./...

      - name: Restore corplink-rs Android helper cache
        id: corplink-helper-cache
        uses: actions/cache@v4
        with:
          path: |
            assets/bin/android-arm64-v8a/corplink-rs-login
            android/app/src/main/jniLibs/arm64-v8a/libcorplink-rs-login.so
          key: corplink-helper-android-arm64-e3465ad82fb071ccc2a9d5ed903c5bc5cdc06c92-ndk28.2-api35-v1

      - name: Build corplink-rs Android login helper
        if: steps.corplink-helper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Full clone + checkout by SHA is more reliable than the previous
          # shallow-clone-then-fetch-by-SHA flow. With --depth 1, fetching a
          # SHA that is not on the default branch can silently leave HEAD on
          # a different commit, which produced an APK that still contained
          # the pre-e3465ad "feilian password login returned no completion
          # URL" error on Android. A full clone guarantees the checkout SHA.
          git clone https://github.com/luantu/corplink-rs.git tools/corplink-rs-src
          git -C tools/corplink-rs-src checkout e3465ad82fb071ccc2a9d5ed903c5bc5cdc06c92
          # Sanity-check: fail the build loudly if the checkout did not land
          # on the expected commit, so a future CI regression is obvious.
          actual_sha=$(git -C tools/corplink-rs-src rev-parse HEAD)
          if [ "$actual_sha" != "e3465ad82fb071ccc2a9d5ed903c5bc5cdc06c92" ]; then
            echo "::error::helper checkout landed on $actual_sha, expected e3465ad82fb071ccc2a9d5ed903c5bc5cdc06c92"
            exit 1
          fi
          export ANDROID_CLANG="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export ANDROID_AR="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_CLANG"
          export CC_aarch64_linux_android="$ANDROID_CLANG"
          export AR_aarch64_linux_android="$ANDROID_AR"
          cargo build --manifest-path tools/corplink-rs-src/Cargo.toml \
            --release --target aarch64-linux-android \
            --no-default-features --features login-helper \
            --bin corplink-rs-login
          mkdir -p assets/bin/android-arm64-v8a
          install -m 0700 \
            tools/corplink-rs-src/target/aarch64-linux-android/release/corplink-rs-login \
            assets/bin/android-arm64-v8a/corplink-rs-login
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 \
            tools/corplink-rs-src/target/aarch64-linux-android/release/corplink-rs-login \
            android/app/src/main/jniLibs/arm64-v8a/libcorplink-rs-login.so
          # Print the source SHA of the binary that just got shipped, so
          # future logcat investigations can correlate helper behaviour
          # with the exact commit that produced the .so.
          echo "Helper built from corplink-rs commit $actual_sha"

      - name: Restore Mihomo-SG Android core cache
        id: mihomo-sg-cache
        uses: actions/cache@v4
        with:
          path: libclash/android/arm64-v8a
          key: mihomo-sg-android-arm64-go1.24.6-ndk28.2-${{ hashFiles('core/**', 'setup.dart') }}

      - name: Build Mihomo-SG Android library
        if: steps.mihomo-sg-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -p=2
        run: |
          set -o pipefail
          go version
          go env GOOS GOARCH CGO_ENABLED CC ANDROID_NDK ANDROID_NDK_ROOT
          timeout --signal=TERM --kill-after=30s 25m dart setup.dart android --arch arm64 --out core 2>&1 | tee android-core-build.log

      - name: Verify Android native build inputs
        shell: bash
        run: |
          set -euo pipefail
          helper=android/app/src/main/jniLibs/arm64-v8a/libcorplink-rs-login.so
          helper_asset=assets/bin/android-arm64-v8a/corplink-rs-login
          meta=libclash/android/arm64-v8a/libmeta.so
          header=libclash/android/arm64-v8a/libmeta.h
          test -s "$helper"
          test -s "$helper_asset"
          test -s "$meta"
          test -s "$header"
          file "$helper" | grep -Eiq 'aarch64|ARM aarch64'
          file "$helper_asset" | grep -Eiq 'aarch64|ARM aarch64'
          file "$meta" | grep -Eiq 'aarch64|ARM aarch64'
          readelf_bin="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf_bin" -h "$meta" > build/libmeta-elf-header.txt
          "$readelf_bin" -Ws "$meta" > build/libmeta-elf-symbols.txt
          grep -q 'AArch64' build/libmeta-elf-header.txt
          grep -Eq '[[:space:]]startTUN$' build/libmeta-elf-symbols.txt
          grep -Eq '[[:space:]]androidTunReady$' build/libmeta-elf-symbols.txt

      - name: Publish Android build diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Android core build diagnostics'
            echo '```'
            if test -f android-core-build.log; then tail -n 240 android-core-build.log; else echo 'Mihomo-SG core restored from cache'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sg-build-log
          path: android-core-build.log
          if-no-files-found: ignore

      - name: Build APK
        # Keep the test-signed pre-release identity; hide only its UI ribbon.
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SHOW_APP_ENV_BANNER=false

      - name: Verify APK native payload
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          unzip -Z1 "$apk" > build/apk-file-list.txt
          grep -q '^lib/arm64-v8a/libmeta.so$' build/apk-file-list.txt
          grep -q '^lib/arm64-v8a/libcore.so$' build/apk-file-list.txt
          grep -q '^lib/arm64-v8a/libcorplink-rs-login.so$' build/apk-file-list.txt
          grep -q '^lib/arm64-v8a/libcode_forge.so$' build/apk-file-list.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bettbox-android-arm64-sg
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
