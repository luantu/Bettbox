name: Android SG APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/corplink-sg-node
      - codex/feilian-android

concurrency:
  group: android-sg-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # The SG fork has been verified locally with Go 1.24.6. Keep the
          # Android cross-build on that toolchain until the native dependency
          # set is independently verified with Go 1.25.
          go-version: '1.24.6'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Configure reproducible test signing
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/sg-test.keystore
          {
            echo "storeFile=sg-test.keystore"
            echo "keyAlias=bettbox-sg-test"
            echo "storePassword=bettbox-sg-test"
            echo "keyPassword=bettbox-sg-test"
          } >> android/local.properties

      - name: Build corplink-rs Android login helper
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/luantu/corplink-rs.git tools/corplink-rs-src
          git -C tools/corplink-rs-src fetch --depth 1 origin a6e1b61527cb6d143221b0bf010ff1b40917298e
          git -C tools/corplink-rs-src checkout a6e1b61527cb6d143221b0bf010ff1b40917298e
          export ANDROID_CLANG="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export ANDROID_AR="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_CLANG"
          export CC_aarch64_linux_android="$ANDROID_CLANG"
          export AR_aarch64_linux_android="$ANDROID_AR"
          cargo build --manifest-path tools/corplink-rs-src/Cargo.toml \
            --release --target aarch64-linux-android \
            --no-default-features --features login-helper \
            --bin corplink-rs-login
          mkdir -p assets/bin/android-arm64-v8a
          install -m 0700 \
            tools/corplink-rs-src/target/aarch64-linux-android/release/corplink-rs-login \
            assets/bin/android-arm64-v8a/corplink-rs-login
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 \
            tools/corplink-rs-src/target/aarch64-linux-android/release/corplink-rs-login \
            android/app/src/main/jniLibs/arm64-v8a/libcorplink-rs-login.so

      - name: Build Mihomo-SG Android library
        shell: bash
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -p=2
        run: |
          set -o pipefail
          go version
          go env GOOS GOARCH CGO_ENABLED CC ANDROID_NDK ANDROID_NDK_ROOT
          flutter pub get
          timeout --signal=TERM --kill-after=30s 25m dart setup.dart android --arch arm64 --out app 2>&1 | tee android-core-build.log

      - name: Publish Android build diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Android core build diagnostics'
            echo '```'
            if test -f android-core-build.log; then tail -n 240 android-core-build.log; else echo 'log file was not created'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-sg-build-log
          path: android-core-build.log
          if-no-files-found: ignore

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bettbox-android-arm64-sg
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
